# SyHost - "v1.0.0" gibi bir etiket push edilince: derle, test et, Releases sayfasina koy
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Elle baslatilinca (workflow_dispatch) yazilan etiketin kendisi derlenir, baslatildigi dal degil
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # Derleme ve testler repodaki betikleri calistirir: yayinlama izni olan anahtar .git\config'te durmasin
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: powershell
        run: .\build\Build.ps1 -Publish -Terminal

      - name: Tests must pass before anything is published
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'selftest'
          .\dist\SyHost.exe --selftest shortcuts (Join-Path $t 'sc'); if ($LASTEXITCODE) { exit 1 }
          .\dist\SyHost.exe --selftest folderlook (Join-Path $t 'fl\SyHost') tr; if ($LASTEXITCODE) { exit 1 }
          .\tests\terminal\Test-TerminalExe.ps1; if ($LASTEXITCODE) { exit 1 }
          .\tests\av\Test-Lint.ps1; if ($LASTEXITCODE) { exit 1 }
          if (Test-Path .\tests\parity\Run-Parity.ps1) { .\tests\parity\Run-Parity.ps1 -NoBuild; if ($LASTEXITCODE) { exit 1 } }

      - name: Name the files and write checksums
        id: files
        shell: powershell
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\SyHost.exe "out\SyHost-$ver.exe"
          # SyHost Legacy (Terminal) de her surumde cikar: eksikse yayinlama durur
          if (-not (Test-Path dist\SyHost-Terminal.exe)) { throw 'dist\SyHost-Terminal.exe is missing' }
          # GitHub dosyalari adina gore siralar: "SyHost-1.0.0.exe" (SyHost Modern, onerilen) "SyHost-Legacy-1.0.0.exe"den once gelir
          Copy-Item dist\SyHost-Terminal.exe "out\SyHost-Legacy-$ver.exe"
          # Saglama toplamlari ayri bir dosya degil, surum notlarinin sonunda (indirilecek yalnizca iki dosya olsun)
          $sums = Get-ChildItem out\*.exe | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $notes = "docs\releases\$ver.md"
          $body = if (Test-Path $notes) { [IO.File]::ReadAllText((Resolve-Path $notes), [Text.Encoding]::UTF8) } else { '' }
          $body = $body.TrimEnd() + "`n`n### SHA-256`n`n``````text`n" + ($sums -join "`n") + "`n```````n"
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'out\notes.md'), $body, (New-Object Text.UTF8Encoding $false))
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ver=$ver" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh bilgi satirlarini stderr'e yazabilir: hata degil, cikis kodu denetlenir
          $ErrorActionPreference = 'Continue'
          $tag = '${{ steps.files.outputs.tag }}'; $ver = '${{ steps.files.outputs.ver }}'
          # Releases sayfasinda gorunen adlar (dosya adlari ayni kalir): "dosya#ad"
          $assets = @("out\SyHost-$ver.exe#SyHost Modern (C#) - recommended", "out\SyHost-Legacy-$ver.exe#SyHost Legacy (Terminal)")
          # Ayni etiket yeniden gonderildiyse (or. yeni bir commit'e tasindi) eski yayin yenisiyle degistirilir; etiket kalir
          $existing = @(& gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE) { exit 1 }
          if ($existing -contains $tag) {
            & gh release delete $tag --yes
            if ($LASTEXITCODE) { exit 1 }
          }
          $ghArgs = @('release', 'create', $tag) + $assets + @('--title', "SyHost $ver", '--verify-tag', '--notes-file', 'out\notes.md')
          & gh @ghArgs
          if ($LASTEXITCODE) { exit 1 }
