# SyHost - "v1.0.0" gibi bir etiket push edilince: derle, test et, Releases sayfasına koy
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: powershell
        run: .\build\Build.ps1 -Publish -Terminal

      - name: Tests must pass before anything is published
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'selftest'
          .\dist\SyHost.exe --selftest shortcuts (Join-Path $t 'sc'); if ($LASTEXITCODE) { exit 1 }
          .\dist\SyHost.exe --selftest folderlook (Join-Path $t 'fl\SyHost') tr; if ($LASTEXITCODE) { exit 1 }
          if (Test-Path .\tests\parity\Run-Parity.ps1) { .\tests\parity\Run-Parity.ps1 -NoBuild; if ($LASTEXITCODE) { exit 1 } }

      - name: Name the files and write checksums
        id: files
        shell: powershell
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $ver = $tag.TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\SyHost.exe "out\SyHost-$ver.exe"
          if (Test-Path dist\SyHost-Terminal.exe) { Copy-Item dist\SyHost-Terminal.exe "out\SyHost-$ver-Terminal.exe" }
          Get-ChildItem out\*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out\SHA256SUMS.txt -Encoding ASCII
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ver=$ver" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.files.outputs.tag }}'; $ver = '${{ steps.files.outputs.ver }}'
          $notes = "docs\releases\$ver.md"
          $assets = @("out\SyHost-$ver.exe")
          if (Test-Path "out\SyHost-$ver-Terminal.exe") { $assets += "out\SyHost-$ver-Terminal.exe" }
          $assets += 'out\SHA256SUMS.txt'
          $ghArgs = @('release', 'create', $tag) + $assets + @('--title', "SyHost $ver", '--verify-tag')
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          & gh @ghArgs
          if ($LASTEXITCODE) { exit 1 }
